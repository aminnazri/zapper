; Zapper Bluetooth bridge: an ESP32 that pairs with the TV as a Bluetooth
; keyboard + mouse + media remote, and takes orders from Zapper over USB.
;
; Flash with Scripts/flash-bridge.sh (picks the env from the board it finds),
; or by hand:  pio run -e esp32dev -t upload
;
; Any ESP32 with Bluetooth LE works: the original ESP32, ESP32-S3, ESP32-C3.
; The ESP32-S2 has no Bluetooth and cannot be used.

[env]
platform = espressif32@6.9.0
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
; Talk over the S3's native USB port rather than a UART bridge chip.
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
